<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Главная</title>
</head>
<body>
   <h1>Устройства</h1>

    {% for i in devices %}
        {% set dev = devices[i] %}

        <div>
            Устройство: {{dev['name']}},
            значение: <span id=val_{{i}}>{{dev['value']}}</span>,
            сеть: <span id=live_{{i}}>{{lives[i]}}</span>
        </div>

        {% if dev['type'] == "switch" %}
            <form action="device" method="post">
                <input type="hidden" name="device_id" value="{{i}}">
                <button type="submit" name="cmd" value="ON">Включить</button><br><br>
                <button type="submit" name="cmd" value="OFF">Выключить</button><br><br>
            </form>
        {% endif %}
    {% endfor %}

   <h1>RF24</h1>
   <form action="RF24" method="post">
        <button type="submit" name="RF24" value="1">Включить</button><br><br>
        <button type="submit" name="RF24" value="0">Выключить</button><br><br>
   </form>

   <script>
        async function updateStatus() {
        let response = await fetch("/api/status");
        let data = await response.json();

        for (let i in data["devices"]) {
            val_id = "val_" + i;
            live_id = "live_" + i;
            document.getElementById(val_id).textContent= data["devices"][i]["value"];
            document.getElementById(live_id).textContent= data["lives"][i];
        }
    }
    setInterval(updateStatus, 1000);
   </script>
</body>
</html>
